[build-system]
    requires = ["setuptools >= 61"]
    build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
    where = ["source"]
    exclude = ["tests"]

[tool.setuptools.dynamic]
    version = {attr = "autograder_binds.Python.__version__"}


[project]
    name = "128Autograder iPython Binds"
    authors = [
        { name = "Gregory Bell" }
    ]

    maintainers = [
        { name = "Gregory Bell" }
    ]

    dynamic = ["version"]

    requires-python = ">=3.11.0"


