name: Platforms Integration Tests

on:
  pull_request:

jobs:
  macos-core-unittests:
    runs-on: "macos-latest"
    strategy:
      matrix:
        python-version: ["3.11", "3.12" ]
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'

      - name: Run tests
        run: |
          python3 -m unittest

  windows-core-unittests:
    runs-on: "windows-latest"
    strategy:
      matrix:
        python-version: ["3.11", "3.12" ]
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'

      - name: Run tests
        run: |
          python3 -m unittest

  macos-python-unittests:
    runs-on: "macos-latest"
    strategy:
      matrix:
        python-version: ["3.11", "3.12" ]
    defaults:
      run:
        working-directory: languages/python

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'
          cd ../../core
          pip install -e .

      - name: Core Tests
        run: |
          python3 -m unittest

  windows-python-unittests:
    runs-on: "windows-latest"
    strategy:
      matrix:
        python-version: ["3.11", "3.12" ]
    defaults:
      run:
        working-directory: languages/python

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'
          cd ../../core
          pip install -e .

      - name: Core Tests
        run: |
          python3 -m unittest

